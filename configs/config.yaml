# Analysis configuration: finance assumptions, management constraints, paths and seeds.
# Nothing here is ground truth. Values marked (assumption) are management or finance inputs that the
# sensitivity analysis (phase 5) varies; values marked (policy) are constraints management has chosen and can
# change. The simulated world lives in configs/ground_truth_SYNTHETIC.yaml, which models must not read.

seed: 20261031

paths:
  raw_dir: data/raw
  duckdb: data/processed/marketing_SYNTHETIC.duckdb
  reports_dir: reports
  tables_dir: reports/tables
  figures_dir: reports/figures
  artifacts_dir: artifacts
  dashboard_dir: dashboard

businesses: [B1, B2, B3]

# Decision metric (D-004): incremental contribution over 24 months, discounted, net of ad spend.
valuation:
  horizon_months: 24               # (policy) how far ahead customer value is counted
  annual_discount_rate: 0.10       # (assumption) finance cost of capital
  payback_target_months:           # (policy) CFO payback ceiling per business
    B1: 12
    B2: 18
    B3: 9                          # B3 is at about 13 months at last year's mix (D-011)

# Finance-provided unit economics (assumption). Retention and repeat rates are NOT given here: phase 1
# estimates them from the customer cohort tables.
unit_economics:
  B1: {model: subscription, monthly_revenue: 72.0, monthly_contribution: 23.0, acquisition_cost: 30.0}
  B2: {model: subscription, monthly_revenue: 400.0, monthly_contribution: 320.0, acquisition_cost: 900.0}
  B3: {model: ecommerce, order_revenue: 140.0, order_contribution: 42.0, acquisition_cost: 10.0}

budget:
  annual_total: 2000000            # (policy) fixed paid-acquisition budget
  business_limits:                 # (policy) floors agreed when each business was acquired; ceilings for risk
    B1: {min: 600000, max: 1100000}
    B2: {min: 350000, max: 800000}
    B3: {min: 400000, max: 900000}
  channel_limits:                  # (policy) multiples of last year's spend on that line
    default: {min_multiple: 0.25, max_multiple: 2.0}
    overrides:
      B1.search_brand: {min_multiple: 0.50}      # (assumption) defensive brand bidding; phase 4 tests it
      B2.review_sites: {max_multiple: 1.5}       # (assumption) limited inventory on review platforms
  concentration:
    max_line_share: 0.25           # (policy) no single business-channel line above 25% of the budget
    max_business_share: 0.50       # (policy) no business above 50% of the budget
  min_acquisition:                 # (policy) new customers per year as a share of last year's volume
    B1: 0.90
    B2: 0.90
    B3: 0.90
  sales_capacity:                  # (assumption) B2 sales team can work at most this many qualified leads a week
    B2: {max_qualified_leads_per_week: 40}
  untested_line_guardrail: 0.25    # (policy) lines with no experiment move at most +/-25% of last year's spend (D-023)
  risk:
    uncertainty_draws: 200         # refits of the response curves used by the optimiser (D-006)
    downside_quantile: 0.10        # the "pessimistic" outcome: mean of the worst 10% of draws
    downside_floor: status_quo     # (policy) the plan's pessimistic outcome must be no worse than last year's split

data_quality:
  restatement_tolerance: 0.05      # spend changed by more than 5% after first report -> restated
  duplicate_window_days: 30        # B2: same e-mail domain within 30 days is a duplicate lead
  outage_min_crm_customers: 3      # platform reports 0 while the CRM credits the line with >= 3 customers
  shift_min_segment_weeks: 8       # attribution-ratio change point: each side at least 8 weeks
  shift_alpha: 0.01                # significance level, Bonferroni-adjusted across lines
  shift_min_change: 0.15           # and at least a 15% change in the platform / CRM ratio

retention:
  value_draws: 2000                # Monte Carlo draws for the customer-value confidence interval

forecasting:
  targets: [spend, clicks, leads, qualified_leads, customers, revenue, contribution_profit]
  horizon_weeks: 13                # one quarter: the budget review cycle
  min_train_weeks: 104             # two full seasons before the first forecast origin
  origin_step_weeks: 4             # a new forecast every 4 weeks in the backtest
  season_weeks: 52.1775            # 365.25 / 7
  fourier_terms: 3                 # annual sine/cosine pairs in the regression and boosting models
  interval_level: 0.80             # prediction intervals (10th to 90th percentile)
  selection_tolerance: 0.05        # pick the simplest model whose WAPE is within 5% (relative) of the best
  models: [naive, seasonal_naive, ets, regression, gbm]   # ordered from simplest to most complex
  gbm: {max_iter: 300, learning_rate: 0.05, max_leaf_nodes: 15, min_samples_leaf: 10}

# Experiment designs (phase 3). Thresholds are business choices; baselines marked (assumption) come from
# outside the warehouse (e.g. web analytics); everything else is estimated from the SQL layer.
experiments:
  alpha: 0.05                      # two-sided
  power: 0.80
  landing_page:
    business: B1
    baseline_conversion: 0.024     # (assumption) web-analytics conversion of paid landing traffic
    weekly_visitors: 30000         # (assumption) web analytics
    min_detectable_uplift: 0.05    # relative; what the test is sized to detect (smaller is too costly to test)
    build_cost: 25000              # (assumption) design and build; the break-even uplift is derived from it
    max_weeks: 16
  ad_creative:
    business: B3
    channel: social_prospecting
    min_worthwhile_uplift: 0.05    # relative CTR change
    impressions_per_user: 3.0      # (assumption) frequency cap
    icc: 0.01                      # (assumption) correlation of clicks within a user, for the design effect
    max_weeks: 6
  audience_targeting:
    business: B2
    channel: linkedin
    min_worthwhile_change: 0.15    # relative change in qualified leads per dollar
    max_weeks: 12
  geo:
    n_regions: 40
    pre_weeks: 8
    candidate_test_weeks: [8, 12, 16]      # tests run in the last 24 weeks: 8 pre-period weeks, then the test
    candidate_treated_shares: [0.25, 0.5]
    detect_share_of_platform_claim: 0.5    # size each budget test to detect half of what the platform claims
    permutations: 2000                     # randomisation-inference draws
  geo_tests:                       # region-level budget and bidding tests; design picks duration and share
    bidding_tcpa:      {business: B1, channel: search_generic, treatment: tcpa, target_effect: 0.02}
    retargeting_off:   {business: B3, channel: display_retargeting, treatment: spend, spend_multiplier: 0.0}
    brand_search_off:  {business: B1, channel: search_brand, treatment: spend, spend_multiplier: 0.0}
    social_plus_50:    {business: B3, channel: social_prospecting, treatment: spend, spend_multiplier: 1.5}

# Response curves (phase 4): one marketing-mix model per business, calibrated to the phase 3 budget tests.
response_model:
  shape: 1.0                       # Hill shape fixed at 1 (concave): S-shapes are not identifiable from 156 weeks
  decay_bounds: [0.0, 0.8]
  decay_prior: {mean: 0.3, sd: 0.3}              # (assumption) weak
  half_sat_bounds: [0.2, 5.0]                    # x the line's average weekly spend
  half_sat_prior_sd_log: 1.1                     # (assumption) weak: half-saturation within ~3x of average spend
  organic_floor_sd_log: 0.05                     # (assumption) organic demand >= CRM organic-source customers
  calibrate: true                                # use the phase 3 budget tests
  budget_step: 100000                            # for the value of one more budget dollar

# Sensitivity analysis (phase 5)
sensitivity:
  refit_draws: 40                  # curve draws for scenarios that refit the model (base uses budget.risk)
  budgets: [1400000, 1600000, 1800000, 2000000, 2200000, 2400000, 2600000, 2800000]
  move_threshold: 0.05             # a line "moves" if its spend changes by more than 5% from last year

# AI-assisted commentary (phase 7). The LLM only drafts; code checks every sentence and a person signs off.
ai_reporting:
  use_llm: false                   # true (or `mbo commentary --llm`) calls the Claude API; false = template only
  model: claude-opus-5-5
  effort: medium
  max_tokens: 16000
  max_attempts: 2                  # one retry with the validator's findings, then fall back to the template
  unusual_z: 3.0                   # flag a 4-week change >= 3 robust standard deviations from its usual change
